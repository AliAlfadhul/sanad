<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sanad architecture — request flow</title>
  <desc>Browser talks only to the backend server. The backend server coordinates a local embedding model, a document index, and Claude's API to answer a question with cited sources.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2f6b57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#f6f5f1"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2430">Sanad — Request Flow</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6472">How a question becomes a grounded, cited answer</text>

  <rect x="290" y="115" width="280" height="320" rx="16" fill="none" stroke="#b9b6aa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="430" y="134" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6472">YOUR SERVER</text>

  <rect x="40" y="250" width="190" height="70" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="135" y="277" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Browser</text>
  <text x="135" y="297" text-anchor="middle" font-size="12" fill="#5b6472">Angular · TypeScript</text>

  <rect x="310" y="150" width="240" height="65" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="430" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Embedding Model</text>
  <text x="430" y="195" text-anchor="middle" font-size="11.5" fill="#5b6472">all-MiniLM-L6-v2 · local</text>

  <rect x="310" y="250" width="240" height="70" rx="10" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
  <text x="430" y="277" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Backend Server</text>
  <text x="430" y="297" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.7)">Node.js · Express</text>

  <rect x="310" y="355" width="240" height="65" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="430" y="381" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Document Index</text>
  <text x="430" y="400" text-anchor="middle" font-size="11.5" fill="#5b6472">chunks + vectors</text>

  <text x="770" y="228" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#2f6b57">EXTERNAL · PAID API</text>
  <rect x="680" y="250" width="180" height="70" rx="10" fill="#ffffff" stroke="#2f6b57" stroke-width="2"/>
  <text x="770" y="277" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Claude</text>
  <text x="770" y="297" text-anchor="middle" font-size="12" fill="#5b6472">Anthropic API</text>

  <line x1="230" y1="285" x2="310" y2="285" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="270" y="272" text-anchor="middle" font-size="10.5" fill="#5b6472">ask ⇄ answer</text>

  <line x1="430" y1="250" x2="430" y2="215" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="460" y="235" text-anchor="middle" font-size="10" fill="#5b6472">text → vector</text>

  <line x1="430" y1="320" x2="430" y2="355" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="470" y="341" text-anchor="middle" font-size="10" fill="#5b6472">similarity search</text>

  <line x1="550" y1="285" x2="680" y2="285" stroke="#2f6b57" stroke-width="1.5" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="615" y="272" text-anchor="middle" font-size="10.5" fill="#2f6b57">excerpts ⇄ answer</text>

  <text x="450" y="470" text-anchor="middle" font-size="11.5" fill="#5b6472">Dashed border = everything that runs on your own machine. Teal = the one external, paid service.</text>
</svg>
