<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sanad architecture — request flow</title>
  <desc>Browser talks only to the backend server. The backend server coordinates a local embedding model, a document index, and an LLM (Claude, via Anthropic's API) to answer a question with cited sources.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#2f6b57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2430" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="680" fill="#f6f5f1"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2430">Sanad — Request Flow</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#5b6472">How a question becomes a grounded, cited answer</text>

  <rect x="290" y="125" width="280" height="470" rx="16" fill="none" stroke="#b9b6aa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="430" y="145" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#5b6472">YOUR SERVER</text>

  <line x1="250" y1="362" x2="310" y2="362" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="349" text-anchor="middle" font-size="9" fill="#5b6472">ask/answer</text>

  <line x1="430" y1="305" x2="430" y2="265" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="463" y="288" text-anchor="middle" font-size="10" fill="#5b6472">text → vector</text>

  <line x1="430" y1="420" x2="430" y2="460" stroke="#5b6472" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="475" y="443" text-anchor="middle" font-size="10" fill="#5b6472">similarity search</text>

  <line x1="550" y1="362" x2="680" y2="362" stroke="#2f6b57" stroke-width="1.5" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="615" y="349" text-anchor="middle" font-size="10.5" fill="#2f6b57">excerpts ⇄ answer</text>

  <!-- Browser -->
  <rect x="40" y="305" width="210" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="145" cy="337" r="18" fill="#2f6b57"/>
  <rect x="136" y="330" width="18" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <line x1="136" y1="335" x2="154" y2="335" stroke="#ffffff" stroke-width="1.1"/>
  <text x="145" y="383" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">Browser</text>
  <text x="145" y="401" text-anchor="middle" font-size="12" fill="#5b6472">Angular · TypeScript</text>

  <!-- Embedding model -->
  <rect x="310" y="150" width="240" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="430" cy="182" r="18" fill="#2f6b57"/>
  <circle cx="423" cy="187" r="2.2" fill="#ffffff"/>
  <circle cx="437" cy="187" r="2.2" fill="#ffffff"/>
  <circle cx="430" cy="175" r="2.2" fill="#ffffff"/>
  <line x1="423" y1="187" x2="430" y2="175" stroke="#ffffff" stroke-width="1"/>
  <line x1="437" y1="187" x2="430" y2="175" stroke="#ffffff" stroke-width="1"/>
  <line x1="423" y1="187" x2="437" y2="187" stroke="#ffffff" stroke-width="1"/>
  <text x="430" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Embedding Model</text>
  <text x="430" y="246" text-anchor="middle" font-size="11.5" fill="#5b6472">all-MiniLM-L6-v2 · local</text>

  <!-- Backend -->
  <rect x="310" y="305" width="240" height="115" rx="12" fill="#1b2430" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="430" cy="337" r="18" fill="#2f6b57"/>
  <rect x="421" y="330" width="18" height="4" rx="1" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <rect x="421" y="336" width="18" height="4" rx="1" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <rect x="421" y="342" width="18" height="4" rx="1" fill="none" stroke="#ffffff" stroke-width="1.1"/>
  <text x="430" y="383" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">Backend Server</text>
  <text x="430" y="401" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.7)">Node.js · Express</text>

  <!-- Document index -->
  <rect x="310" y="460" width="240" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="430" cy="492" r="18" fill="#2f6b57"/>
  <rect x="422" y="483" width="13" height="16" rx="1.5" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <line x1="425" y1="488" x2="432" y2="488" stroke="#ffffff" stroke-width="1"/>
  <line x1="425" y1="492" x2="432" y2="492" stroke="#ffffff" stroke-width="1"/>
  <line x1="425" y1="496" x2="429" y2="496" stroke="#ffffff" stroke-width="1"/>
  <text x="430" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Document Index</text>
  <text x="430" y="556" text-anchor="middle" font-size="11.5" fill="#5b6472">chunks + vectors</text>

  <!-- LLM -->
  <text x="780" y="278" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#2f6b57">EXTERNAL · PAID API</text>
  <rect x="680" y="305" width="200" height="115" rx="12" fill="#ffffff" stroke="#2f6b57" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="780" cy="337" r="18" fill="#2f6b57"/>
  <path d="M780 328L782 335L789 337L782 339L780 346L778 339L771 337L778 335Z" fill="#ffffff"/>
  <text x="780" y="383" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2430">LLM</text>
  <text x="780" y="401" text-anchor="middle" font-size="12" fill="#5b6472">Claude · Anthropic API</text>

  <text x="450" y="650" text-anchor="middle" font-size="11.5" fill="#5b6472">Dashed border = everything that runs on your own machine. Teal = the one external, paid service.</text>
</svg>
