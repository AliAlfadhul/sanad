<svg width="820" height="660" viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sanad — grounding and refusal logic</title>
  <desc>A question is embedded and compared against every stored document chunk. Below a similarity threshold, the system refuses rather than guessing, without ever calling Claude. Above it, the top matches are sent to Claude, which must cite its source or refuse again.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b3432f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6b57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="660" fill="#f6f5f1"/>

  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2430">Sanad — Grounding &amp; Refusal Logic</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#5b6472">The core mechanism: answer only when the evidence is strong enough</text>

  <line x1="410" y1="140" x2="410" y2="180" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="270" y="80" width="280" height="60" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="410" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Question</text>
  <text x="410" y="122" text-anchor="middle" font-size="11.5" fill="#5b6472">arrives from the browser</text>

  <line x1="410" y1="240" x2="410" y2="280" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <rect x="270" y="180" width="280" height="60" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="410" y="204" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Embed the question</text>
  <text x="410" y="222" text-anchor="middle" font-size="11.5" fill="#5b6472">text → 384-number vector</text>

  <rect x="270" y="280" width="280" height="60" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.5"/>
  <text x="410" y="304" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Compare to every stored chunk</text>
  <text x="410" y="322" text-anchor="middle" font-size="11.5" fill="#5b6472">cosine similarity score</text>

  <text x="410" y="365" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5" fill="#1b2430">best match score?</text>

  <line x1="380" y1="375" x2="220" y2="418" stroke="#b3432f" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="270" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#b3432f">below 0.3</text>

  <line x1="440" y1="375" x2="600" y2="418" stroke="#2f6b57" stroke-width="1.5" marker-end="url(#arrow-teal2)"/>
  <text x="555" y="400" text-anchor="middle" font-size="11" font-weight="600" fill="#2f6b57">0.3 or above</text>

  <rect x="90" y="420" width="260" height="68" rx="10" fill="#ffffff" stroke="#b3432f" stroke-width="2"/>
  <text x="220" y="444" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Refuse</text>
  <text x="220" y="462" text-anchor="middle" font-size="11.5" fill="#5b6472">say plainly: not covered</text>
  <text x="220" y="508" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5b6472">Claude is never called — free, instant</text>

  <rect x="470" y="420" width="260" height="68" rx="10" fill="#ffffff" stroke="#2f6b57" stroke-width="2"/>
  <text x="600" y="444" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Ask Claude</text>
  <text x="600" y="462" text-anchor="middle" font-size="11.5" fill="#5b6472">send the top 4 excerpts</text>

  <line x1="600" y1="488" x2="600" y2="528" stroke="#2f6b57" stroke-width="1.5" marker-end="url(#arrow-teal2)"/>
  <rect x="470" y="528" width="260" height="68" rx="10" fill="#1b2430" stroke="#1b2430" stroke-width="1.5"/>
  <text x="600" y="552" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Claude Answers</text>
  <text x="600" y="570" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.75)">must cite the source, or refuse again</text>

  <text x="410" y="635" text-anchor="middle" font-size="11.5" fill="#5b6472">This branch is what lets Sanad say "I don't know" instead of guessing.</text>
</svg>
