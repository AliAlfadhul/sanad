<svg width="1520" height="600" viewBox="0 0 1520 600" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sanad — grounding and refusal logic</title>
  <desc>A question is embedded and compared against every stored document chunk. Below a similarity threshold, the system refuses rather than guessing, without ever calling the LLM. Above it, the top matches are sent to the LLM, which must cite its source or refuse again.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b3432f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-teal2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2f6b57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2430" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1520" height="600" fill="#f6f5f1"/>

  <text x="760" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1b2430">Sanad — Grounding &amp; Refusal Logic</text>
  <text x="760" y="58" text-anchor="middle" font-size="13" fill="#5b6472">The core mechanism: answer only when the evidence is strong enough</text>

  <line x1="270" y1="299.5" x2="330" y2="299.5" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="560" y1="299.5" x2="620" y2="299.5" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <line x1="850" y1="280" x2="930" y2="150" stroke="#b3432f" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="880" y="165" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b3432f">below 0.3</text>

  <line x1="850" y1="320" x2="930" y2="449.5" stroke="#2f6b57" stroke-width="1.5" marker-end="url(#arrow-teal2)"/>
  <text x="874" y="440" text-anchor="middle" font-size="10" font-weight="600" fill="#2f6b57">0.3 or above</text>

  <line x1="1160" y1="449.5" x2="1240" y2="449.5" stroke="#2f6b57" stroke-width="1.5" marker-end="url(#arrow-teal2)"/>

  <!-- Question -->
  <rect x="40" y="242" width="230" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <circle cx="155" cy="274" r="18" fill="#2f6b57"/>
  <rect x="146" y="267" width="18" height="12" rx="3" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <path d="M151 279L149 283L154 279Z" fill="#ffffff"/>
  <text x="155" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Question</text>
  <text x="155" y="338" text-anchor="middle" font-size="11.5" fill="#5b6472">arrives from the browser</text>

  <!-- Embed -->
  <rect x="330" y="242" width="230" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <circle cx="445" cy="274" r="18" fill="#2f6b57"/>
  <circle cx="438" cy="279" r="2.2" fill="#ffffff"/>
  <circle cx="452" cy="279" r="2.2" fill="#ffffff"/>
  <circle cx="445" cy="267" r="2.2" fill="#ffffff"/>
  <line x1="438" y1="279" x2="445" y2="267" stroke="#ffffff" stroke-width="1"/>
  <line x1="452" y1="279" x2="445" y2="267" stroke="#ffffff" stroke-width="1"/>
  <line x1="438" y1="279" x2="452" y2="279" stroke="#ffffff" stroke-width="1"/>
  <text x="445" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Embed the question</text>
  <text x="445" y="338" text-anchor="middle" font-size="11.5" fill="#5b6472">text → 384-number vector</text>

  <!-- Compare -->
  <rect x="620" y="242" width="230" height="115" rx="12" fill="#ffffff" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <circle cx="735" cy="274" r="18" fill="#2f6b57"/>
  <circle cx="732" cy="271" r="6" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <line x1="736" y1="275" x2="741" y2="280" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="735" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Compare to every chunk</text>
  <text x="735" y="338" text-anchor="middle" font-size="11.5" fill="#5b6472">cosine similarity score</text>

  <!-- Refuse -->
  <rect x="930" y="92" width="230" height="115" rx="12" fill="#ffffff" stroke="#b3432f" stroke-width="2" filter="url(#cardShadow2)"/>
  <circle cx="1045" cy="124" r="18" fill="#b3432f"/>
  <line x1="1039" y1="118" x2="1051" y2="130" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="1051" y1="118" x2="1039" y2="130" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1045" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Refuse</text>
  <text x="1045" y="188" text-anchor="middle" font-size="11.5" fill="#5b6472">say plainly: not covered</text>
  <text x="1045" y="227" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5b6472">the LLM is never called — free, instant</text>

  <!-- Ask the LLM -->
  <rect x="930" y="392" width="230" height="115" rx="12" fill="#ffffff" stroke="#2f6b57" stroke-width="2" filter="url(#cardShadow2)"/>
  <circle cx="1045" cy="424" r="18" fill="#2f6b57"/>
  <path d="M1045 415L1047 422L1054 424L1047 426L1045 433L1043 426L1036 424L1043 422Z" fill="#ffffff"/>
  <text x="1045" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2430">Ask the LLM</text>
  <text x="1045" y="488" text-anchor="middle" font-size="11.5" fill="#5b6472">send the top 4 excerpts</text>

  <!-- LLM Answers -->
  <rect x="1240" y="392" width="230" height="115" rx="12" fill="#1b2430" stroke="#1b2430" stroke-width="1.5" filter="url(#cardShadow2)"/>
  <circle cx="1355" cy="424" r="18" fill="#2f6b57"/>
  <path d="M1355 415L1357 422L1364 424L1357 426L1355 433L1353 426L1346 424L1353 422Z" fill="#ffffff"/>
  <text x="1355" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">LLM Answers</text>
  <text x="1355" y="488" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.75)">must cite, or refuse again</text>

  <text x="760" y="565" text-anchor="middle" font-size="11.5" fill="#5b6472">This branch is what lets Sanad say "I don't know" instead of guessing.</text>
</svg>
